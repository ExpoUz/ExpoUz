worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 20M;

  # Security headers
  add_header X-Frame-Options        "SAMEORIGIN"  always;
  add_header X-Content-Type-Options "nosniff"     always;
  add_header X-XSS-Protection       "1; mode=block" always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
  gzip_min_length 256;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

  # ─── API — api.scorewithus.uz ───────────────────────────────────────────────
  server {
    listen 80;
    server_name api.scorewithus.uz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl http2;
    server_name api.scorewithus.uz;

    ssl_certificate     /etc/nginx/ssl/live/api.scorewithus.uz/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/api.scorewithus.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass         http://api:3001;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /v1/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass         http://api:3001;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # WebSocket (Socket.IO gateway)
    location /socket.io/ {
      proxy_pass         http://api:3001;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
    }
  }

  # ─── Admin Panel — admin.scorewithus.uz ─────────────────────────────────────
  server {
    listen 80;
    server_name admin.scorewithus.uz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl http2;
    server_name admin.scorewithus.uz;

    ssl_certificate     /etc/nginx/ssl/live/admin.scorewithus.uz/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/admin.scorewithus.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
      proxy_pass         http://admin:3000;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }

  # ─── Telegram Mini App — app.scorewithus.uz ─────────────────────────────────
  server {
    listen 80;
    server_name app.scorewithus.uz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl http2;
    server_name app.scorewithus.uz;

    ssl_certificate     /etc/nginx/ssl/live/app.scorewithus.uz/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/app.scorewithus.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Expo web build (static files served here after deploy)
    root /var/www/app;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}
